<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Division Logo - High fidelity version based on actual logo -->
  
  <!-- Outer circle -->
  <circle cx="250" cy="250" r="245" fill="url(#bgGradient)" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0fa;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="iconGradientBlue" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#0066B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005AA0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="iconGradientGreen" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#9DD115;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8CB903;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Central icon - white background circle -->
  <circle cx="250" cy="250" r="90" fill="white" stroke="#d0d0d0" stroke-width="3"/>
  
  <!-- Blue segment (approximately 60% of circle) -->
  <!-- Bottom left to top, going clockwise -->
  <path d="M 250 250 L 250 160 A 90 90 0 1 1 186.4 313.6 Z" 
        fill="url(#iconGradientBlue)"/>
  
  <!-- Green segment (approximately 40% of circle) -->
  <!-- Top to bottom right, going clockwise -->
  <path d="M 250 250 L 313.6 186.4 A 90 90 0 0 1 250 340 Z" 
        fill="url(#iconGradientGreen)"/>
  
  <!-- White ring in middle -->
  <circle cx="250" cy="250" r="50" fill="white"/>
  
  <!-- Inner blue segment (smaller version) -->
  <path d="M 250 250 L 250 200 A 50 50 0 1 1 214.6 285.4 Z" 
        fill="url(#iconGradientBlue)"/>
  
  <!-- Inner green segment (smaller version) -->
  <path d="M 250 250 L 285.4 214.6 A 50 50 0 0 1 250 300 Z" 
        fill="url(#iconGradientGreen)"/>
  
  <!-- Center white circle -->
  <circle cx="250" cy="250" r="25" fill="white"/>
  
  <!-- Add subtle text elements to suggest mathematical/code background -->
  <text x="120" y="100" font-family="monospace" font-size="12" fill="#3366aa" opacity="0.3">f(x)=Σ</text>
  <text x="350" y="120" font-family="monospace" font-size="10" fill="#3366aa" opacity="0.3">∫dx</text>
  <text x="80" y="400" font-family="monospace" font-size="9" fill="#333" opacity="0.3">if(x) return</text>
  <text x="320" y="420" font-family="monospace" font-size="9" fill="#333" opacity="0.3">class T{}</text>
</svg>
