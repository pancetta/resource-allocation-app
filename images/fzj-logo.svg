<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- FZJ Logo - Based on actual Forschungszentrum Jülich branding -->
  
  <defs>
    <!-- FZJ Blue gradient -->
    <linearGradient id="fzjBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005AA0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rectangle -->
  <rect width="300" height="80" fill="url(#fzjBlue)" rx="2"/>
  
  <!-- FZJ text -->
  <text x="150" y="45" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="42" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="2">FZJ</text>
  
  <!-- Forschungszentrum Jülich text -->
  <text x="150" y="65" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="11" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="0.5">Forschungszentrum Jülich</text>
</svg>
