<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Matching Funds</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <h1>Test Matching Funds Display</h1>
    <div id="resultsOutput"></div>
    
    <script type="module">
        import { openDatabase, addPerson, addProject, addAllocation, addFteValue, addBudgetValue, clearCache } from './js/data/database.js';
        import { calculateMonth } from './js/views/monthlyReport.js';
        
        async function setupTestData() {
            await openDatabase();
            clearCache();
            
            // Clear database
            const db = await openDatabase();
            const tx = db.transaction(["people", "projects", "defaultAllocations", "fteValues", "budgetValues"], "readwrite");
            await tx.objectStore("people").clear();
            await tx.objectStore("projects").clear();
            await tx.objectStore("defaultAllocations").clear();
            await tx.objectStore("fteValues").clear();
            await tx.objectStore("budgetValues").clear();
            await new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
            clearCache();
            
            // Create base funding project
            await addProject({
                id: 'bf210',
                name: 'Base Funding 210',
                isBaseFunding: true,
                baseFundingType: '210'
            });
            
            // Add budget for base funding: 5 PM per month
            await addBudgetValue({
                projectId: 'bf210',
                plannedPM: 5.0,
                startMonth: '2024-01',
                endMonth: '2024-12'
            });
            
            // Create base funding 220
            await addProject({
                id: 'bf220',
                name: 'Base Funding 220',
                isBaseFunding: true,
                baseFundingType: '220'
            });
            
            await addBudgetValue({
                projectId: 'bf220',
                plannedPM: 0.0,
                startMonth: '2024-01',
                endMonth: '2024-12'
            });
            
            // Create a MATCHING FUNDS project (like DFG)
            await addProject({
                id: 'dfg',
                name: 'DFG',
                deductsFromBaseFunding: true,
                baseFundingTypeId: '210'
            });
            
            // Set planned PM for DFG to 1.0
            await addBudgetValue({
                projectId: 'dfg',
                plannedPM: 1.0,
                startMonth: '2024-01',
                endMonth: '2024-12'
            });
            
            // Create a person of type 210
            await addPerson({
                id: 'p001',
                name: 'Test Person',
                type: '210',
                active: true
            });
            
            // Add FTE value
            await addFteValue({
                personId: 'p001',
                fte: 1.0,
                startMonth: '2024-01',
                endMonth: null
            });
            
            // Allocate 1.0 PM to DFG
            await addAllocation({
                personId: 'p001',
                projectId: 'dfg',
                pm: 1.0,
                startMonth: '2024-01',
                endMonth: '2024-12'
            });
            
            // Generate the report
            await calculateMonth('2024-06');
            
            console.log('Test data setup complete');
        }
        
        setupTestData();
    </script>
</body>
</html>
